<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with Us — WebSoulLabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-500: #2563EB;
      --blue-100: #DBEAFE;
      --blue-50: #EFF6FF;
      --bg: #F8FAFF;
      --surface: #FFFFFF;
      --ink: #0F172A;
      --ink-soft: #475569;
      --ink-muted: #94A3B8;
      --border: #E2E8F0;
      --whatsapp: #25D366;
      --whatsapp-hover: #1EBE5A;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Logo */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 40px;
    }

    .logo-icon { width: 36px; height: 36px; }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: var(--ink);
    }

    .logo-text span { color: var(--blue-500); }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .04);
    }

    /* Check icon */
    .success-icon {
      width: 56px;
      height: 56px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .success-icon svg {
      width: 28px;
      height: 28px;
      color: #059669;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--ink-soft);
      margin-bottom: 32px;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }

    /* WhatsApp CTA */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: var(--whatsapp);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 600;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s ease, box-shadow .2s ease, transform .15s ease;
      box-shadow: 0 4px 18px rgba(37, 211, 102, .2);
    }

    .cta-btn:hover {
      background: var(--whatsapp-hover);
      box-shadow: 0 6px 28px rgba(37, 211, 102, .3);
      transform: translateY(-1px);
    }

    .cta-btn:active { transform: translateY(0); }

    .cta-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
      flex-shrink: 0;
    }

    .cta-note {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 16px;
    }

    .cta-note strong {
      color: var(--ink-soft);
    }

    /* Footer */
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>

  <div class="container">

    <a href="https://www.websoullabs.com" class="logo">
      <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="3.5" fill="#2563EB"/>
        <circle cx="24" cy="8" r="3.5" fill="#2563EB"/>

        <circle cx="20" cy="18" r="3.5" fill="#1A56DB"/>
        <circle cx="32" cy="18" r="3.5" fill="#2563EB"/>
        <circle cx="12" cy="28" r="3.5" fill="#2563EB"/>
        <circle cx="24" cy="28" r="3.5" fill="#2563EB"/>
        <circle cx="8" cy="8" r="2" fill="#3B82F6" opacity=".5"/>
        <circle cx="28" cy="28" r="2" fill="#3B82F6" opacity=".5"/>
      </svg>
      <span class="logo-text">Web<span>SoulLabs</span></span>
    </a>

    <div class="card">

      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>

      <h1>Thank you!</h1>
      <p class="subtitle">Your details have been received. Chat with our HR team on WhatsApp for quick assistance.</p>

      <a
        class="cta-btn"
        href="https://wa.me/918943247706?text=Hi%20WebSoulLabs%2C%20I%20just%20submitted%20my%20details%20via%20your%20ad.%20I%E2%80%99d%20like%20to%20know%20more!"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zm-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.981.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884zm8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Chat with us
      </a>

      <p class="cta-note">HR Team · <strong>+91 89432 47706</strong></p>

    </div>

    <div class="footer">&copy; 2026 WebSoulLabs</div>

  </div>

</body>
</html>
